<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8edf5">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <div class="window-titlebar" aria-hidden="true">
        <span class="window-controls">
          <span class="window-control close"></span>
          <span class="window-control minimize"></span>
          <span class="window-control maximize"></span>
        </span>
        <span class="window-title">Minesweeper</span>
        <span class="window-controls-spacer"></span>
      </div>
      <header class="game-header">
        <div>
          <p class="eyebrow">CLASSIC PUZZLE</p>
          <h1>지뢰찾기</h1>
          <p class="subtitle">숫자를 단서 삼아 지뢰를 모두 찾아보세요.</p>
        </div>
        <div class="header-actions">
          <label class="difficulty-control" for="difficulty">
            <span>난이도</span>
            <select id="difficulty" aria-label="난이도 선택">
              <option value="beginner">초급</option>
              <option value="intermediate">중급</option>
              <option value="advanced">고급</option>
            </select>
          </label>
          <button class="restart-button" id="restart" type="button" aria-label="새 게임 시작">
            <span aria-hidden="true">↻</span>
            <span>새 게임</span>
          </button>
        </div>
      </header>

      <section class="game-panel" aria-label="지뢰찾기 게임">
        <div class="status-bar" aria-live="polite">
          <div class="status-item">
            <span class="status-label">남은 지뢰</span>
            <output class="status-value" id="mine-count">010</output>
          </div>
          <div class="game-face" id="game-face" aria-hidden="true">🙂</div>
          <div class="status-item timer-item">
            <span class="status-label">시간</span>
            <output class="status-value" id="timer">000</output>
          </div>
        </div>

        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="9행 9열 지뢰찾기 보드"></div>
        </div>

        <p class="game-message" id="game-message">칸을 열어 게임을 시작하세요.</p>
      </section>

      <footer class="game-help">
        <span><kbd>클릭</kbd> 칸 열기</span>
        <span><kbd>우클릭</kbd> 없음 → 🚩 → ❓ → 없음</span>
      </footer>
    </main>
  </body>
</html>
