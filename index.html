<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17251f">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">CLASSIC PUZZLE</p>
          <h1>지뢰찾기</h1>
          <p class="subtitle">숫자를 단서 삼아 지뢰를 모두 찾아보세요.</p>
        </div>
        <button class="restart-button" id="restart" type="button" aria-label="새 게임 시작">
          <span aria-hidden="true">↻</span>
          <span>새 게임</span>
        </button>
      </header>

      <section class="game-panel" aria-label="지뢰찾기 게임">
        <div class="status-bar" aria-live="polite">
          <div class="status-item">
            <span class="status-label">남은 지뢰</span>
            <output class="status-value" id="mine-count">010</output>
          </div>
          <div class="game-face" id="game-face" aria-hidden="true">🙂</div>
          <div class="status-item timer-item">
            <span class="status-label">시간</span>
            <output class="status-value" id="timer">000</output>
          </div>
        </div>

        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="9행 9열 지뢰찾기 보드"></div>
        </div>

        <p class="game-message" id="game-message">칸을 열어 게임을 시작하세요.</p>
      </section>

      <footer class="game-help">
        <span><kbd>클릭</kbd> 칸 열기</span>
        <span><kbd>우클릭</kbd> 깃발 · 물음표 표시</span>
      </footer>
    </main>
  </body>
</html>
